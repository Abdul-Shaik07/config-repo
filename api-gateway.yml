server:
  port: 8080

jwt:
  secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437


spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # ---------------- AUTH SERVICE ----------------
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/api/**
            # ---------------- PRODUCT SERVICE ----------------
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/products/api/**
            # ---------------- CART SERVICE ----------------
            - id: cart-service
              uri: lb://CART-SERVICE
              predicates:
                - Path=/cart/api/**
            # ---------------- ORDER SERVICE ----------------
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/order/api/**
