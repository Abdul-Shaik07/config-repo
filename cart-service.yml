server:
  port: 8083
resilience4j:
  circuitbreaker:
    instances:
      cartService:
        failureRateThreshold: 50
        slidingWindowSize: 5
        waitDurationInOpenState: 10s
spring:
  application:
    name: cart-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cart_db
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
